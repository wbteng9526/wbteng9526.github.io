name: Prettier code formatter

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check formatting of active site files
        run: >-
          npx --yes --package prettier@3.3.3 prettier --no-config --print-width 150
          --check index.html stylesheet.css 404.html "news/*.html" "cv/*.html"
          "publications/*.html" "academic_services/*.html" README.md
